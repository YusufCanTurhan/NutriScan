<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karşılaştır | NutriScan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <span style="color:var(--text-main)">Nutri</span>Scan
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item"><a class="nav-link active" href="index.html">Ana Sayfa</a></li>
        <li class="nav-item"><a class="nav-link" href="products.html">Ürünler</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">Hakkımızda</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">İletişim</a></li>
        
        <li class="nav-item border-start ms-lg-3 ps-lg-3 d-none d-lg-block" style="height: 24px; border-color: var(--text-muted) !important;"></li>
        
        <li class="nav-item ms-lg-2">
          <a class="nav-link" href="compare.html" title="Karşılaştır">
            <span class="d-lg-none">⚖️ Karşılaştır</span> <span class="d-none d-lg-block fs-5">⚖️</span> </a>
        </li>
        <li class="nav-item ms-lg-1">
          <a class="nav-link" href="list.html" title="Alışveriş Listem">
            <span class="d-lg-none">🛒 Listem</span>
            <span class="d-none d-lg-block fs-5">🛒</span>
          </a>
        </li>
        <li class="nav-item ms-lg-1">
          <a class="nav-link cursor-pointer" href="#" data-bs-toggle="modal" data-bs-target="#settingsModal" title="Ayarlar">
            <span class="d-lg-none">⚙️ Ayarlar</span>
            <span class="d-none d-lg-block fs-5">⚙️</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container" style="margin-top: 100px; margin-bottom: 60px;">
  <h1 class="text-center fw-bold mb-4">Ürün Karşılaştırma ⚖️</h1>
  
  <div class="row g-3">
    <div class="col-6">
      <div class="card h-100 border-0 shadow-sm text-center p-3" id="slot1">
        <div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 200px;">
          <button class="btn btn-outline-primary rounded-circle p-3 mb-2" onclick="openSearchModal(1)">
            <span class="material-icons-round fs-2">add</span>
          </button>
          <p class="text-muted">1. Ürünü Seç</p>
        </div>
      </div>
    </div>

    <div class="col-6">
      <div class="card h-100 border-0 shadow-sm text-center p-3" id="slot2">
        <div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 200px;">
          <button class="btn btn-outline-primary rounded-circle p-3 mb-2" onclick="openSearchModal(2)">
            <span class="material-icons-round fs-2">add</span>
          </button>
          <p class="text-muted">2. Ürünü Seç</p>
        </div>
      </div>
    </div>
  </div>

  <div id="comparison-table" class="mt-5 d-none fade-in">
    <table class="table table-borderless align-middle text-center">
      <thead class="text-muted small">
        <tr>
          <th style="width: 33%"></th>
          <th style="width: 33%">DEĞERLER (100g)</th>
          <th style="width: 33%"></th>
        </tr>
      </thead>
      <tbody id="comparison-body" class="fw-bold">
        </tbody>
    </table>
  </div>

</div>

<div class="modal fade" id="searchModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Ürün Ara</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="input-group mb-3">
          <input type="text" class="form-control" id="compareSearchInput" placeholder="Örn: Süt">
          <button class="btn btn-primary" onclick="searchForCompare()">Ara</button>
        </div>
        <div id="compareResults" class="list-group"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/compare.js"></script>
</body>
</html>
