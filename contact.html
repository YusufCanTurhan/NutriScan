<head>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <span style="color:var(--text-main)">Nutri</span>Scan
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item"><a class="nav-link active" href="index.html">Ana Sayfa</a></li>
        <li class="nav-item"><a class="nav-link" href="products.html">Ürünler</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">Hakkımızda</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">İletişim</a></li>
        
        <li class="nav-item border-start ms-lg-3 ps-lg-3 d-none d-lg-block" style="height: 24px; border-color: var(--text-muted) !important;"></li>
        
        <li class="nav-item ms-lg-2">
          <a class="nav-link" href="compare.html" title="Karşılaştır">
            <span class="d-lg-none">⚖️ Karşılaştır</span> <span class="d-none d-lg-block fs-5">⚖️</span> </a>
        </li>
        <li class="nav-item ms-lg-1">
          <a class="nav-link" href="list.html" title="Alışveriş Listem">
            <span class="d-lg-none">🛒 Listem</span>
            <span class="d-none d-lg-block fs-5">🛒</span>
          </a>
        </li>
        <li class="nav-item ms-lg-1">
          <a class="nav-link cursor-pointer" href="#" data-bs-toggle="modal" data-bs-target="#settingsModal" title="Ayarlar">
            <span class="d-lg-none">⚙️ Ayarlar</span>
            <span class="d-none d-lg-block fs-5">⚙️</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container" style="margin-top: 100px; margin-bottom: 60px;">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      
      <div class="text-center mb-5">
        <h1 class="fw-bold">İletişime Geç</h1>
        <p class="text-muted">Öneri ve görüşleriniz bizim için değerli.</p>
      </div>

      <div class="card border-0 shadow-lg p-4 p-md-5">
        <form id="contactForm">
          <div class="mb-4">
            <label for="name" class="form-label fw-bold small text-muted">AD SOYAD</label>
            <input type="text" class="form-control" id="name" placeholder="Adınız..." required>
          </div>

          <div class="mb-4">
            <label for="email" class="form-label fw-bold small text-muted">E-POSTA</label>
            <input type="email" class="form-control" id="email" placeholder="ornek@email.com" required>
          </div>

          <div class="mb-4">
            <label for="message" class="form-label fw-bold small text-muted">MESAJINIZ</label>
            <textarea class="form-control" id="message" rows="4" placeholder="Mesajınızı buraya yazın..." required></textarea>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-3 fw-bold">Gönder</button>
        </form>
      </div>

      <div class="d-flex justify-content-around mt-5 text-center">
        <div>
          <span class="material-icons-round text-primary fs-2">email</span>
          <p class="small text-muted mt-2">info@nutriscan.com</p>
        </div>
        <div>
          <span class="material-icons-round text-primary fs-2">location_on</span>
          <p class="small text-muted mt-2">İstanbul, Türkiye</p>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
